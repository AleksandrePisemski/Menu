<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

        <nav>

        <div class="page">

        <div id="all">

            <section id="filters">

                <div class="filter modelFilter">

                    <h3 class="filterLable">Model</h3>

                    <select name="" id="models" >
                        <option value="all">All</option>
                    </select>
                </div>

                <div class="filter brandFilter">
                    <h3>Brand</h3>
                    <select name="" id="brands">

                </div>



                <div id="sorts">
                    <div id="low_high" class="prices">

                    </div>
                    <div id = "high_low" class = "prices">
                        <input id="high-low" type="radio" value="high-low" name="sort">

                    </div>

</div>
